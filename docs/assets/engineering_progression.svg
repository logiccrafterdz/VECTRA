<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="36" font-size="16" font-weight="700" fill="#0f172a">ITERATIVE ENGINEERING PROGRESSION: CUMULATIVE NET P&amp;L (REAL EUR/USD)</text>
  <text x="30" y="56" font-size="12" fill="#475569">Progression from uncalibrated v0.1 baseline (-94.95 USD) to walk-forward calibrated wall-clock architecture (+26.70 USD Net / +42.90 USD Gross)</text>

  <!-- Chart Area: x=90..910, y=80..290, zero line at y=165 -->
  <line x1="90" y1="165" x2="910" y2="165" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="80" y="169" font-size="11" font-weight="600" fill="#475569" text-anchor="end">0.00 USD</text>

  <line x1="90" y1="105" x2="910" y2="105" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="109" font-size="11" fill="#64748b" text-anchor="end">+40.00 USD</text>

  <line x1="90" y1="225" x2="910" y2="225" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="229" font-size="11" fill="#64748b" text-anchor="end">-40.00 USD</text>

  <line x1="90" y1="285" x2="910" y2="285" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="289" font-size="11" fill="#64748b" text-anchor="end">-80.00 USD</text>

  <!-- Stage 0: -94.95 (height = 94.95 * 1.5 = 142.4px below 165 -> y=165..307.4) -->
  <rect x="130" y="165" width="90" height="142" rx="4" fill="#dc2626"/>
  <text x="175" y="324" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">-94.95 USD</text>
  <text x="175" y="155" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Baseline v0.1</text>
  <text x="175" y="342" font-size="10" fill="#64748b" text-anchor="middle">Tick windows (408 fills)</text>

  <!-- Stage 1: -34.30 (height = 34.3 * 1.5 = 51.5px below 165) -->
  <rect x="290" y="165" width="90" height="51.5" rx="4" fill="#f97316"/>
  <text x="335" y="233" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">-34.30 USD</text>
  <text x="335" y="155" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Stage 1</text>
  <text x="335" y="342" font-size="10" fill="#64748b" text-anchor="middle">2x Cost + Cooldown + Exits</text>

  <!-- Stage 2: +5.60 (height = 5.6 * 1.5 = 8.4px above 165 -> y=156.6) -->
  <rect x="450" y="156.6" width="90" height="8.4" rx="3" fill="#0284c7"/>
  <text x="495" y="148" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">+5.60 USD</text>
  <text x="495" y="182" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Stage 2</text>
  <text x="495" y="342" font-size="10" fill="#64748b" text-anchor="middle">Wall-Clock Windows (120/240/720s)</text>

  <!-- Stage 3: +22.60 (height = 22.6 * 1.5 = 33.9px above 165 -> y=131.1) -->
  <rect x="610" y="131.1" width="90" height="33.9" rx="4" fill="#2563eb"/>
  <text x="655" y="123" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">+22.60 USD</text>
  <text x="655" y="182" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Stage 3</text>
  <text x="655" y="342" font-size="10" fill="#64748b" text-anchor="middle">Block Regime Efficiency (&gt;=0.55)</text>

  <!-- Stage 4: +26.70 Net / +42.90 Gross -->
  <rect x="760" y="125" width="55" height="40" rx="4" fill="#16a34a"/>
  <rect x="820" y="100.6" width="55" height="64.4" rx="4" fill="#0d9488"/>
  <text x="787" y="117" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">+26.70 Net</text>
  <text x="847" y="93" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">+42.90 Gross</text>
  <text x="817" y="182" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Stage 4 (Locked)</text>
  <text x="817" y="342" font-size="10" fill="#64748b" text-anchor="middle">Brier Score Move Scaling (0.45)</text>
</svg>
